<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>บันทึกเงินครอบครัว</title>
<meta name="theme-color" content="#0e0f14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Serif+Thai:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="bg-glow g1"></div>
  <div class="bg-glow g2"></div>

  <header class="topbar">
    <div class="brand"><i class="fa-solid fa-gem"></i> <span>บันทึกเงินครอบครัว</span></div>
    <button id="btn-refresh" class="icon-btn" title="รีเฟรชข้อมูล"><i class="fa-solid fa-arrows-rotate"></i></button>
  </header>

  <!-- HOME VIEW -->
  <main id="view-home" class="view active">
    <section class="overview-card">
      <p class="overview-label">ยอดรวมทุกกองทุน</p>
      <h2 id="overview-total">฿0.00</h2>
      <button id="btn-share-all" class="btn-line">
        <i class="fa-brands fa-line"></i> แชร์สรุปยอดไปไลน์
      </button>
    </section>

    <div id="fund-list" class="fund-list">
      <!-- fund cards injected by app.js -->
    </div>
  </main>

  <!-- FUND DETAIL VIEW -->
  <main id="view-detail" class="view">
    <button id="btn-back" class="back-btn"><i class="fa-solid fa-arrow-left"></i> กลับหน้ารวม</button>

    <section class="detail-card">
      <div class="detail-icon" id="detail-icon"><i class="fa-solid fa-piggy-bank"></i></div>
      <p class="detail-label" id="detail-name">ชื่อกองทุน</p>
      <h2 id="detail-balance">฿0.00</h2>

      <div class="action-row">
        <button id="btn-deposit" class="btn-action btn-deposit">
          <i class="fa-solid fa-arrow-down"></i>
          <span>ฝากเงิน</span>
        </button>
        <button id="btn-withdraw" class="btn-action btn-withdraw">
          <i class="fa-solid fa-arrow-up"></i>
          <span>ถอนเงิน</span>
        </button>
      </div>

      <button id="btn-share-fund" class="btn-line btn-line-sm">
        <i class="fa-brands fa-line"></i> แชร์รายการนี้ไปไลน์
      </button>
    </section>

    <section class="history-section">
      <h3><i class="fa-solid fa-clock-rotate-left"></i> ประวัติรายการ</h3>
      <div id="history-list" class="history-list">
        <p class="empty-state">ยังไม่มีรายการ</p>
      </div>
    </section>
  </main>

  <!-- TRANSACTION MODAL -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">ฝากเงิน</h3>
        <button type="button" id="btn-close-modal" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="tx-form">
        <label for="tx-amount">จำนวนเงิน (บาท)</label>
        <input type="number" id="tx-amount" min="0.01" step="0.01" required placeholder="0.00" inputmode="decimal">

        <label for="tx-date">วันที่</label>
        <input type="date" id="tx-date" required>

        <label for="tx-note">บันทึกเพิ่มเติม</label>
        <textarea id="tx-note" rows="2" placeholder="เช่น ค่าเทอมเดือน ส.ค., เงินเดือน..."></textarea>

        <div class="modal-actions">
          <button type="button" id="btn-cancel" class="btn-secondary">ยกเลิก</button>
          <button type="submit" id="btn-submit" class="btn-primary">
            <span class="btn-submit-text">บันทึก</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <div id="loading-overlay" class="loading-overlay">
    <div class="spinner"></div>
    <p>กำลังโหลดข้อมูล...</p>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
